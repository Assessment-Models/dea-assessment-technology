# Level 2 — contract conformance for the technology assessment instrument
# (CR-AM-11 §14). Reuses Assessment-Models/assessment-ci's reusable Level 2
# workflow to resolve the §15 contract handshake against the published
# contract suite at the pinned dea-metamodel release. Mutable refs
# (main/master/latest) are rejected by the reusable workflow's guard.
name: Contract conformance (Level 2)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-conformance:
    uses: Assessment-Models/assessment-ci/.github/workflows/contract-conformance.yml@main
    with:
      dea-metamodel-ref: 1bbc08d08587931ea0b4fb9d1ee5cf00bd5852f0  # same pin as the first-model candidate; switch to a tag when dea-metamodel publishes one
      manifest-path: model.yaml
